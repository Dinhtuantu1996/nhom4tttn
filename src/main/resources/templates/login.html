<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - nhom4tttn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="auth-body">
<main class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100 py-4">
        <div class="col-md-8 col-lg-5 col-xl-4">
            <div class="auth-card p-4 p-lg-5 shadow-lg">
                <a th:href="@{/}" class="text-decoration-none text-dark d-inline-flex align-items-center gap-2 mb-4">
                    <span class="brand-mark">N4</span><strong>nhom4tttn</strong>
                </a>
                <span class="eyebrow d-block">TÀI KHOẢN</span>
                <h1 class="h2 fw-bold mt-2">Đăng nhập</h1>
                <p class="text-secondary">Dùng session mặc định của Spring Security, không Redis.</p>

                <div class="alert alert-danger" th:if="${param.error}">Email hoặc mật khẩu không đúng.</div>
                <div class="alert alert-success" th:if="${param.logout}">Đã đăng xuất.</div>

                <form th:action="@{/login}" method="post" class="mt-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input class="form-control form-control-lg" type="email" name="email" required autofocus autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mật khẩu</label>
                        <input class="form-control form-control-lg" type="password" name="password" required autocomplete="current-password">
                    </div>
                    <button class="btn btn-dark btn-lg w-100 rounded-pill" type="submit">Đăng nhập</button>
                </form>

                <div class="d-flex justify-content-between mt-4 small">
                    <a th:href="@{/forgot-password}" class="text-secondary">Quên mật khẩu</a>
                    <a th:href="@{/register}" class="text-secondary">Đăng ký</a>
                </div>
                <div class="demo-account mt-4 p-3 rounded-4 small">
                    <strong>Tài khoản demo:</strong><br>
                    admin@nhom4tttn.local / Admin@123
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
