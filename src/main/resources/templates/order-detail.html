<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${'Đơn ' + order.code + ' - N4'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/n4-logo.svg}">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
    <div class="mb-4">
        <a class="text-decoration-none text-secondary" th:if="${!lookupMode}" th:href="@{/orders/my}">← Đơn hàng của tôi</a>
        <a class="text-decoration-none text-secondary" th:if="${lookupMode}" th:href="@{/orders/lookup}">← Tra cứu đơn khác</a>
    </div>

    <div class="row g-4 align-items-start">
        <div class="col-lg-8">
            <section class="commerce-card p-4 p-md-5">
                <div class="d-flex flex-wrap justify-content-between gap-3 align-items-start">
                    <div>
                        <span class="eyebrow">HÓA ĐƠN / ĐƠN HÀNG</span>
                        <h1 class="h3 fw-bold mt-2 mb-1" th:text="${order.code}"></h1>
                        <div class="text-secondary small" th:text="${'Đặt lúc ' + order.createdDateText}"></div>
                    </div>
                    <span class="order-status-badge order-status-badge-lg" th:classappend="${' status-' + #strings.toLowerCase(order.status.name())}" th:text="${order.status.label}"></span>
                </div>

                <div class="order-item-list mt-4">
                    <article class="order-line" th:each="item : ${order.items}">
                        <div class="min-w-0">
                            <div class="fw-bold" th:text="${item.productName}"></div>
                            <div class="small text-secondary mt-1" th:if="${item.variantName != null}" th:text="${item.variantName}"></div>
                            <div class="small text-secondary mt-1" th:text="${item.unitPriceText + ' × ' + item.quantity}"></div>
                        </div>
                        <strong class="text-nowrap" th:text="${item.lineTotalText}"></strong>
                    </article>
                </div>

                <div class="d-flex justify-content-between align-items-end gap-3 border-top pt-4 mt-4">
                    <span class="h6 mb-0">Tổng cộng</span>
                    <strong class="h4 mb-0" th:text="${order.totalAmountText}"></strong>
                </div>
            </section>
        </div>

        <div class="col-lg-4">
            <aside class="commerce-card p-4">
                <span class="eyebrow">THÔNG TIN NHẬN HÀNG</span>
                <dl class="order-info-list mt-3 mb-0">
                    <div><dt>Họ tên</dt><dd th:text="${order.customerName}"></dd></div>
                    <div><dt>Email</dt><dd th:text="${order.customerEmail}"></dd></div>
                    <div><dt>Số điện thoại</dt><dd th:text="${order.phone}"></dd></div>
                    <div><dt>Địa chỉ</dt><dd th:text="${order.address}"></dd></div>
                    <div th:if="${order.note != null}"><dt>Ghi chú</dt><dd th:text="${order.note}"></dd></div>
                </dl>
                <div class="alert alert-light border small mt-4 mb-0">Thông tin sản phẩm và giá trên hóa đơn là dữ liệu chốt tại thời điểm đặt hàng, không thay đổi theo catalog sau này.</div>
            </aside>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
