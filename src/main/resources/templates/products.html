<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sản phẩm - nhom4tttn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
            <span class="eyebrow">DANH MỤC SẢN PHẨM</span>
            <h1 class="display-6 fw-bold mt-2 mb-1">Khám phá sản phẩm</h1>
            <p class="text-secondary mb-0" th:text="${products.totalElements + ' sản phẩm phù hợp'}"></p>
        </div>
        <button th:if="${isAdmin}"
                type="button"
                class="btn btn-primary rounded-pill px-4"
                th:attr="data-product-form-url=@{/products/form}">
            + Thêm sản phẩm
        </button>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form method="get" th:action="@{/products}" class="filter-panel p-3 p-lg-4 mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-12 col-lg-4">
                <label class="form-label fw-semibold">Tìm kiếm</label>
                <input type="search" class="form-control form-control-lg" name="keyword" th:value="${keyword}" placeholder="Tên sản phẩm...">
            </div>
            <div class="col-6 col-lg-2">
                <label class="form-label fw-semibold">Danh mục</label>
                <select class="form-select form-select-lg" name="categoryId">
                    <option value="">Tất cả</option>
                    <th:block th:each="root : ${categories}">
                        <option th:value="${root.id}" th:text="${root.name}" th:selected="${categoryId == root.id}"></option>
                        <option th:each="child : ${root.children}"
                                th:value="${child.id}"
                                th:text="${'— ' + child.name}"
                                th:selected="${categoryId == child.id}"></option>
                    </th:block>
                </select>
            </div>
            <div class="col-6 col-lg-2">
                <label class="form-label fw-semibold">Giới tính</label>
                <select class="form-select form-select-lg" name="gender">
                    <option value="">Tất cả</option>
                    <option th:each="item : ${genders}"
                            th:value="${item}"
                            th:text="${item.label}"
                            th:selected="${gender == item}"></option>
                </select>
            </div>
            <div class="col-6 col-lg-2">
                <label class="form-label fw-semibold">Độ tuổi</label>
                <select class="form-select form-select-lg" name="ageGroup">
                    <option value="">Tất cả</option>
                    <option th:each="item : ${ageGroups}"
                            th:value="${item}"
                            th:text="${item.label}"
                            th:selected="${ageGroup == item}"></option>
                </select>
            </div>
            <div class="col-6 col-lg-2">
                <label class="form-label fw-semibold">Sắp xếp</label>
                <select class="form-select form-select-lg" name="sort">
                    <option value="newest" th:selected="${sort == 'newest'}">Mới cập nhật</option>
                    <option value="oldest" th:selected="${sort == 'oldest'}">Cũ nhất</option>
                    <option value="views" th:selected="${sort == 'views'}">Xem nhiều</option>
                    <option value="name" th:selected="${sort == 'name'}">Tên A-Z</option>
                </select>
            </div>
            <div class="col-12 d-flex gap-2 justify-content-end">
                <a th:href="@{/products}" class="btn btn-outline-secondary rounded-pill px-4">Đặt lại</a>
                <button class="btn btn-dark rounded-pill px-4" type="submit">Lọc sản phẩm</button>
            </div>
        </div>
    </form>

    <section data-product-load-more
             th:attr="data-load-url=@{/products/more},data-next-page=${products.number + 1},data-last=${products.last}">
        <div id="productGrid" class="row g-3" th:if="${products.hasContent()}">
            <div th:replace="~{fragments/product-batch :: batch}"></div>
        </div>

        <div class="empty-state text-center p-5" th:if="${!products.hasContent()}">
            <h2 class="h4">Không tìm thấy sản phẩm</h2>
            <p class="text-secondary">Thử thay đổi từ khóa hoặc bộ lọc.</p>
            <a th:href="@{/products}" class="btn btn-dark rounded-pill px-4">Xem tất cả</a>
        </div>

        <div class="text-center mt-4 pt-4 border-top"
             th:if="${products.hasContent() && !products.last}"
             data-load-more-wrap>
            <button type="button"
                    class="btn btn-outline-dark rounded-pill px-4"
                    data-load-more-products>
                <span data-load-more-spinner class="spinner-border spinner-border-sm me-2 d-none" aria-hidden="true"></span>
                <span data-load-more-label>Xem thêm sản phẩm</span>
            </button>
            <div class="small text-danger mt-2 d-none" data-load-more-error>Không thể tải thêm sản phẩm. Hãy thử lại.</div>
        </div>
    </section>

    <div class="modal fade" id="productDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 rounded-4 shadow" data-product-detail-content>
                <div class="modal-body py-5 text-center text-secondary">Đang tải chi tiết...</div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="productFormModal" tabindex="-1" aria-hidden="true" th:if="${isAdmin}">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 rounded-4 shadow" data-product-modal-content>
                <div class="modal-body py-5 text-center text-secondary">Đang tải biểu mẫu...</div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
