<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.name + ' - N4'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/n4-logo.svg}">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="mb-4"><a th:href="@{/products}" class="text-decoration-none text-secondary">← Quay lại sản phẩm</a></div>
    <div class="row g-5">
        <div class="col-lg-7">
            <div id="productGallery" class="carousel slide product-detail-gallery" th:if="${!#lists.isEmpty(product.images)}">
                <div class="carousel-inner rounded-4 overflow-hidden bg-light">
                    <div class="carousel-item" th:each="image, state : ${product.images}" th:classappend="${state.first} ? 'active'">
                        <img class="d-block w-100" th:src="${image.url}" th:alt="${product.name}">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#productGallery" data-bs-slide="prev" th:if="${product.images.size() > 1}">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#productGallery" data-bs-slide="next" th:if="${product.images.size() > 1}">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
            <div class="product-detail-empty" th:if="${#lists.isEmpty(product.images)}">N4</div>
        </div>
        <div class="col-lg-5">
            <div class="sticky-lg-top detail-sticky" data-product-detail-scope
                 th:attr="data-product-id=${product.id},data-product-variant-type=${product.variantType},data-product-quantity=${product.quantity}">
                <div class="d-flex flex-wrap gap-2 mb-3">
                    <a class="badge rounded-pill text-bg-light border text-decoration-none text-dark" th:each="category : ${product.categories}" th:href="@{/products(categoryId=${category.id})}" th:text="${category.name}"></a>
                </div>
                <h1 class="display-6 fw-bold" th:text="${product.name}"></h1>
                <div class="d-flex gap-3 text-secondary small mt-3">
                    <span th:text="${product.viewCount + ' lượt xem'}"></span>
                    <span th:text="${'Cập nhật ' + product.updatedDateText}"></span>
                </div>
                <div class="product-detail-commercial mt-4"
                     data-product-commercial
                     th:classappend="${product.variantType > 0 ? ' variant-price-pending' : ''}"
                     th:attr="data-default-price-text=${product.displayPriceAvailable ? product.displayPriceText : 'Liên hệ'},data-default-available=${product.displayPriceAvailable},data-variant-type=${product.variantType}">
                    <div data-product-price
                         th:class="${product.displayPriceAvailable ? 'product-detail-price' : 'product-detail-contact-price'}"
                         th:text="${product.displayPriceAvailable ? product.displayPriceText : 'Liên hệ'}"></div>
                    <div class="product-detail-stock" data-product-stock
                         th:text="${product.variantType == 0
                             ? (product.quantity > 0 ? 'Còn ' + product.quantity + ' sản phẩm' : 'Liên hệ N4 để biết thêm thông tin.')
                             : (product.displayPriceAvailable ? 'Chọn biến thể để xem giá và số lượng.' : 'Hiện chưa có biến thể còn hàng.')}"></div>
                </div>

                <div th:replace="~{fragments/product-variant-display :: selector}"></div>

                <div class="d-flex gap-2 flex-wrap mt-4" th:if="${!#sets.isEmpty(product.attributes)}">
                    <span class="badge rounded-pill text-bg-light border text-dark p-2"
                          th:each="attribute : ${product.attributes}"
                          th:text="${attribute.parent.name + ': ' + attribute.name}"></span>
                </div>
                <hr class="my-4">
                <div class="product-description" th:text="${product.description}"></div>
                <div class="d-grid gap-2 mt-4">
                    <button type="button"
                            class="btn btn-teal btn-lg rounded-pill"
                            data-add-to-cart
                            th:disabled="${product.variantType == 0 ? product.quantity <= 0 : true}">
                        Thêm vào giỏ hàng
                    </button>
                    <a th:href="@{/contact}" class="btn btn-outline-dark rounded-pill">Liên hệ hỏi mua</a>
                    <a th:if="${isAdmin}" th:href="@{/products/{id}/edit(id=${product.id})}" class="btn btn-outline-primary rounded-pill">Sửa sản phẩm</a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
