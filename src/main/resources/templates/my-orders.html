<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đơn hàng của tôi - N4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/n4-logo.svg}">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
    <div class="commerce-page-head mb-4">
        <div>
            <span class="eyebrow">ĐƠN HÀNG CỦA TÔI</span>
            <h1 class="display-6 fw-bold mt-2 mb-1">Lịch sử mua hàng</h1>
            <p class="text-secondary mb-0" th:text="${'Tất cả đơn đã đặt bằng email ' + accountEmail}"></p>
        </div>
        <a class="btn btn-outline-dark rounded-pill px-4" th:href="@{/products}">Tiếp tục mua sắm</a>
    </div>

    <div class="commerce-card overflow-hidden" th:if="${!#lists.isEmpty(orders)}">
        <div class="table-responsive">
            <table class="table align-middle mb-0 order-table">
                <thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr></thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td><strong th:text="${order.code}"></strong></td>
                    <td th:text="${order.createdDateText}"></td>
                    <td class="fw-semibold" th:text="${order.totalAmountText}"></td>
                    <td><span class="order-status-badge" th:classappend="${' status-' + #strings.toLowerCase(order.status.name())}" th:text="${order.status.label}"></span></td>
                    <td class="text-end"><a class="btn btn-sm btn-outline-dark rounded-pill px-3" th:href="@{/orders/my/{code}(code=${order.code})}">Chi tiết</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="commerce-card p-5 text-center" th:if="${#lists.isEmpty(orders)}">
        <h2 class="h5 fw-bold">Chưa có đơn hàng nào</h2>
        <p class="text-secondary">Đơn đặt bằng cùng email tài khoản sẽ xuất hiện tại đây.</p>
        <a class="btn btn-dark rounded-pill px-4" th:href="@{/products}">Xem sản phẩm</a>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
