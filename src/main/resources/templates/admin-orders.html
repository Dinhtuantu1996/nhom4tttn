<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý đơn hàng - N4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/n4-logo.svg}">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
    <div class="commerce-page-head mb-4">
        <div>
            <span class="eyebrow">ADMIN</span>
            <h1 class="display-6 fw-bold mt-2 mb-1">Quản lý đơn hàng</h1>
            <p class="text-secondary mb-0" th:text="${orders.totalElements + ' đơn hàng'}"></p>
        </div>
        <a class="btn btn-outline-dark rounded-pill px-4" th:href="@{/products}">Về sản phẩm</a>
    </div>

    <form class="commerce-card p-3 p-md-4 mb-4" method="get" th:action="@{/admin/orders}">
        <div class="row g-3 align-items-end">
            <div class="col-lg-7">
                <label class="form-label fw-semibold" for="orderKeyword">Tìm kiếm</label>
                <input class="form-control" id="orderKeyword" name="keyword" th:value="${keyword}" placeholder="Mã đơn, tên, email hoặc số điện thoại">
            </div>
            <div class="col-lg-3">
                <label class="form-label fw-semibold" for="orderStatus">Trạng thái</label>
                <select class="form-select" id="orderStatus" name="status">
                    <option value="">Tất cả trạng thái</option>
                    <option th:each="item : ${statuses}" th:value="${item.name()}" th:selected="${status == item}" th:text="${item.label}"></option>
                </select>
            </div>
            <div class="col-lg-2 d-grid">
                <button class="btn btn-dark rounded-pill" type="submit">Lọc đơn</button>
            </div>
        </div>
    </form>

    <div class="commerce-card overflow-hidden">
        <div class="table-responsive">
            <table class="table align-middle mb-0 order-table">
                <thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Liên hệ</th><th>Tổng tiền</th><th>Trạng thái</th><th>Ngày đặt</th><th></th></tr></thead>
                <tbody>
                <tr th:each="order : ${orders.content}">
                    <td><strong th:text="${order.code}"></strong></td>
                    <td>
                        <div class="fw-semibold" th:text="${order.customerName}"></div>
                        <div class="small text-secondary" th:text="${order.customerEmail}"></div>
                    </td>
                    <td th:text="${order.phone}"></td>
                    <td class="fw-semibold text-nowrap" th:text="${order.totalAmountText}"></td>
                    <td><span class="order-status-badge" th:classappend="${' status-' + #strings.toLowerCase(order.status.name())}" th:text="${order.status.label}"></span></td>
                    <td class="text-nowrap" th:text="${order.createdDateText}"></td>
                    <td class="text-end"><a class="btn btn-sm btn-outline-dark rounded-pill px-3" th:href="@{/admin/orders/{id}(id=${order.id})}">Xem</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders.content)}">
                    <td colspan="7" class="py-5 text-center text-secondary">Không có đơn hàng phù hợp.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-4" th:if="${orders.totalPages > 1}" aria-label="Phân trang đơn hàng">
        <ul class="pagination justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${orders.first ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/admin/orders(page=${orders.number - 1},keyword=${keyword},status=${status != null ? status.name() : null})}">‹</a>
            </li>
            <li class="page-item" th:each="index : ${#numbers.sequence(0, orders.totalPages - 1)}" th:classappend="${index == orders.number ? 'active' : ''}">
                <a class="page-link" th:href="@{/admin/orders(page=${index},keyword=${keyword},status=${status != null ? status.name() : null})}" th:text="${index + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${orders.last ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/admin/orders(page=${orders.number + 1},keyword=${keyword},status=${status != null ? status.name() : null})}">›</a>
            </li>
        </ul>
    </nav>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
