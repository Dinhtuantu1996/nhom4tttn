<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="product-batch"
     th:attr="data-last=${products.last},data-next-page=${products.number + 1}"
     th:fragment="batch">
    <div class="product-load-item" th:each="product : ${products.content}">
        <article class="product-card h-100 position-relative"
                 th:classappend="${!product.enable ? ' is-hidden-product' : ''}">
            <span class="product-hidden-badge" th:if="${isAdmin and !product.enable}">Đã ẩn</span>

            <div class="product-admin-actions" th:if="${isAdmin}">
                <button aria-label="Sửa sản phẩm"
                        class="btn btn-sm btn-light rounded-circle shadow-sm"
                        th:attr="data-product-form-url=@{/products/{id}/form(id=${product.id})}"
                        title="Sửa sản phẩm"
                        type="button">✎
                </button>

                <form method="post"
                      th:action="@{/products/{id}/visibility(id=${product.id})}"
                      th:attr="data-confirm-action=${product.enable ? 'Sản phẩm sẽ được ẩn khỏi trang bán hàng và khách sẽ không thể đặt mua. Bạn vẫn có thể hiện lại bất cứ lúc nào.' : null},
                               data-confirm-title=${product.enable ? 'Ẩn sản phẩm?' : null},
                               data-confirm-button=${product.enable ? 'Ẩn sản phẩm' : null}">
                    <input name="enable" th:value="${!product.enable}" type="hidden">
                    <button class="btn btn-sm btn-light rounded-circle shadow-sm"
                            th:attr="aria-label=${product.enable ? 'Ẩn sản phẩm' : 'Hiện sản phẩm'}"
                            th:classappend="${product.enable ? ' text-warning' : ' text-success'}"
                            th:title="${product.enable ? 'Ẩn sản phẩm' : 'Hiện sản phẩm'}"
                            type="submit">
                        <svg aria-hidden="true" fill="none" height="17" stroke="currentColor" stroke-linecap="round"
                             stroke-linejoin="round" stroke-width="2" th:if="${product.enable}" viewBox="0 0 24 24"
                             width="17">
                            <path d="M2.1 12s3.6-7 9.9-7 9.9 7 9.9 7-3.6 7-9.9 7-9.9-7-9.9-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg aria-hidden="true" fill="none" height="17" stroke="currentColor" stroke-linecap="round"
                             stroke-linejoin="round" stroke-width="2" th:if="${!product.enable}" viewBox="0 0 24 24"
                             width="17">
                            <path d="m3 3 18 18"/>
                            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                            <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.3 0 9.9 8 9.9 8a17.7 17.7 0 0 1-2.1 3.2"/>
                            <path d="M6.6 6.6C3.7 8.5 2.1 12 2.1 12S5.7 20 12 20a10.3 10.3 0 0 0 4.1-.8"/>
                        </svg>
                    </button>
                </form>
            </div>

            <a class="text-decoration-none text-dark d-block"
               th:attr="data-product-detail-url=@{/products/{id}/detail(id=${product.id})}"
               th:href="@{/products}">
                <div class="product-media">
                    <img loading="lazy"
                         th:alt="${product.name}"
                         th:if="${product.primaryImageUrl != null}"
                         th:src="${product.primaryImageUrl}">
                    <div class="product-placeholder" th:if="${product.primaryImageUrl == null}">GN</div>
                </div>
                <div class="p-3 pb-2">
                    <h2 class="h6 fw-bold product-card-name mb-0" th:text="${product.name}"></h2>
                </div>
            </a>

            <div class="product-card-footer">
                <a class="product-card-contact"
                   th:href="@{/contact}"
                   th:if="${product.quantity <= 0}">Liên hệ</a>
                <span class="product-card-price"
                      th:if="${product.quantity > 0}"
                      th:text="${product.priceText}"></span>
                <span class="product-card-views">
                    <span aria-hidden="true" class="product-view-icon"></span>
                    <span data-product-card-view-count th:text="${product.viewCount}"></span>
                </span>
            </div>
        </article>
    </div>
</div>
</body>
</html>
