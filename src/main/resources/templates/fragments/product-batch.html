<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="batch"
     class="product-batch"
     th:attr="data-last=${products.last},data-next-page=${products.number + 1}">
    <div class="product-load-item" th:each="product : ${products.content}">
        <article class="product-card h-100 position-relative"
                 th:classappend="${!product.enable ? ' is-hidden-product' : ''}">
            <span class="product-hidden-badge" th:if="${isAdmin and !product.enable}">Đã ẩn</span>

            <div class="product-admin-actions" th:if="${isAdmin}">
                <button type="button"
                        class="btn btn-sm btn-light rounded-circle shadow-sm"
                        title="Sửa sản phẩm"
                        aria-label="Sửa sản phẩm"
                        th:attr="data-product-form-url=@{/products/{id}/form(id=${product.id})}">✎</button>

                <form th:action="@{/products/{id}/visibility(id=${product.id})}"
                      method="post"
                      th:attr="data-confirm-action=${product.enable ? 'Sản phẩm sẽ được ẩn khỏi trang bán hàng và khách sẽ không thể đặt mua. Bạn vẫn có thể hiện lại bất cứ lúc nào.' : null},
                               data-confirm-title=${product.enable ? 'Ẩn sản phẩm?' : null},
                               data-confirm-button=${product.enable ? 'Ẩn sản phẩm' : null}">
                    <input type="hidden" name="enable" th:value="${!product.enable}">
                    <button class="btn btn-sm btn-light rounded-pill shadow-sm product-visibility-button"
                            th:classappend="${product.enable ? ' text-warning' : ' text-success'}"
                            type="submit"
                            th:title="${product.enable ? 'Ẩn sản phẩm' : 'Hiện sản phẩm'}"
                            th:attr="aria-label=${product.enable ? 'Ẩn sản phẩm' : 'Hiện sản phẩm'}"
                            th:text="${product.enable ? 'Ẩn' : 'Hiện'}">Ẩn</button>
                </form>
            </div>

            <a class="text-decoration-none text-dark d-block"
               th:href="@{/products}"
               th:attr="data-product-detail-url=@{/products/{id}/detail(id=${product.id})}">
                <div class="product-media">
                    <img th:if="${product.primaryImageUrl != null}"
                         th:src="${product.primaryImageUrl}"
                         th:alt="${product.name}"
                         loading="lazy">
                    <div th:if="${product.primaryImageUrl == null}" class="product-placeholder">GN</div>
                </div>
                <div class="p-3 pb-2">
                    <h2 class="h6 fw-bold product-card-name mb-0" th:text="${product.name}"></h2>
                </div>
            </a>

            <div class="product-card-footer">
                <a th:if="${product.quantity <= 0}"
                   th:href="@{/contact}"
                   class="product-card-contact">Liên hệ</a>
                <span th:if="${product.quantity > 0}"
                      class="product-card-price"
                      th:text="${product.priceText}"></span>
                <span class="product-card-views">
                    <span class="product-view-icon" aria-hidden="true"></span>
                    <span data-product-card-view-count th:text="${product.viewCount}"></span>
                </span>
            </div>
        </article>
    </div>
</div>
</body>
</html>
