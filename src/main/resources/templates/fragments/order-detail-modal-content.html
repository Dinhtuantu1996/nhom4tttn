<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="modal-header border-0 pb-0">
        <div>
            <span class="eyebrow">CHI TIẾT ĐƠN HÀNG</span>
            <h2 class="modal-title h4 fw-bold mt-2 mb-1" th:text="${order.code}"></h2>
            <div class="text-secondary small" th:text="${'Đặt lúc ' + order.createdDateText}"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
    </div>

    <div class="modal-body pt-4 customer-order-scroll">
        <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
            <a class="text-decoration-none text-secondary fw-semibold"
               th:if="${lookupMode}"
               data-order-remote-link
               th:href="@{/orders/modal/lookup}">← Tra cứu đơn khác</a>
            <a class="text-decoration-none text-secondary fw-semibold"
               th:if="${!lookupMode}"
               data-order-remote-link
               th:href="@{/orders/modal/my}">← Đơn hàng của tôi</a>
            <span class="order-status-badge order-status-badge-lg"
                  th:classappend="${' status-' + #strings.toLowerCase(order.status.name())}"
                  th:text="${order.status.label}"></span>
        </div>

        <section class="commerce-card p-3 p-md-4">
            <div class="order-item-list">
                <article class="order-line" th:each="item : ${order.items}">
                    <div class="min-w-0">
                        <div class="fw-bold" th:text="${item.productName}"></div>
                        <div class="small text-secondary mt-1" th:text="${item.unitPriceText + ' × ' + item.quantity}"></div>
                    </div>
                    <strong class="text-nowrap" th:text="${item.lineTotalText}"></strong>
                </article>
            </div>

            <div class="d-flex justify-content-between align-items-end gap-3 border-top pt-4 mt-4">
                <span class="h6 mb-0">Tổng cộng</span>
                <strong class="h4 mb-0" th:text="${order.totalAmountText}"></strong>
            </div>
        </section>

        <section class="commerce-card p-3 p-md-4 mt-3">
            <span class="eyebrow">THÔNG TIN NHẬN HÀNG</span>
            <dl class="order-info-list mt-3 mb-0">
                <div><dt>Họ tên</dt><dd th:text="${order.customerName}"></dd></div>
                <div><dt>Email</dt><dd th:text="${order.customerEmail}"></dd></div>
                <div><dt>Số điện thoại</dt><dd th:text="${order.phone}"></dd></div>
                <div><dt>Địa chỉ</dt><dd th:text="${order.address}"></dd></div>
                <div th:if="${order.note != null and !#strings.isEmpty(order.note)}"><dt>Ghi chú</dt><dd th:text="${order.note}"></dd></div>
            </dl>
        </section>
    </div>
</div>
</body>
</html>
