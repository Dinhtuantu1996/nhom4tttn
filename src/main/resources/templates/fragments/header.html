<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="site-header sticky-top border-bottom bg-white">
    <nav class="navbar navbar-expand-lg py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
                <img class="brand-logo" th:src="@{/img/n4-logo.svg}" src="/img/n4-logo.svg" alt="N4 logo">
                <span class="brand-wordmark">N4</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Mở menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Trang chủ</a></li>
                    <li class="nav-item dropdown category-nav-item" data-category-nav>
                        <button class="nav-link dropdown-toggle category-trigger"
                                type="button"
                                data-bs-toggle="dropdown"
                                data-bs-auto-close="outside"
                                aria-expanded="false">
                            <span>Danh mục</span>
                        </button>

                        <div class="dropdown-menu category-menu border-0" data-category-menu>
                            <div class="category-menu-header">
                                <div class="category-menu-heading">Danh mục sản phẩm</div>
                            </div>

                            <div class="category-menu-scroll">
                                <a class="category-menu-all" th:href="@{/products}">
                                    <span class="category-menu-all-icon">
                                        <img th:src="@{/img/n4-logo.svg}" src="/img/n4-logo.svg" alt="">
                                    </span>
                                    <span class="category-menu-all-text">Tất cả sản phẩm</span>
                                    <span class="category-menu-chevron" aria-hidden="true">›</span>
                                </a>

                                <div class="category-tree"
                                     th:if="${navCategories != null and !#lists.isEmpty(navCategories)}">
                                    <div class="category-tree-item"
                                         th:each="root : ${navCategories}"
                                         data-category-root>
                                        <div class="category-root-row">
                                            <a class="category-root-link"
                                               th:href="@{/products(categoryId=${root.id})}"
                                               th:text="${root.name}"></a>

                                            <button class="category-root-toggle"
                                                    type="button"
                                                    data-category-toggle
                                                    th:if="${root.children != null and !#lists.isEmpty(root.children)}"
                                                    th:attr="aria-label=${'Mở danh mục con của ' + root.name}"
                                                    aria-expanded="false">
                                                <span class="category-root-toggle-icon" aria-hidden="true">›</span>
                                            </button>
                                        </div>

                                        <div class="category-child-collapse"
                                             data-category-children
                                             th:if="${root.children != null and !#lists.isEmpty(root.children)}">
                                            <div class="category-child-tree">
                                                <a class="category-child-link"
                                                   th:each="child, childStat : ${root.children}"
                                                   th:href="@{/products(categoryId=${child.id})}">
                                                    <span class="category-child-branch" th:classappend="${childStat.last ? ' is-last' : ''}" aria-hidden="true"></span>
                                                    <span class="category-child-name" th:text="${child.name}"></span>
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="category-menu-empty"
                                     th:if="${navCategories == null or #lists.isEmpty(navCategories)}">
                                    Chưa có danh mục sản phẩm.
                                </div>
                            </div>
                        </div>
                    </li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contact}">Liên hệ</a></li>
                    <li class="nav-item ms-lg-2" th:if="${currentUser == null}">
                        <a class="btn btn-dark rounded-pill px-4" th:href="@{/login}">Đăng nhập</a>
                    </li>
                    <li class="nav-item dropdown ms-lg-2" th:if="${currentUser != null}">
                        <a class="btn btn-outline-dark rounded-pill dropdown-toggle px-4" href="#" role="button" data-bs-toggle="dropdown" th:text="${currentUser.name}"></a>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-4 p-2">
                            <li><span class="dropdown-item-text small text-secondary" th:text="${currentUser.email}"></span></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><form th:action="@{/logout}" method="post"><button class="dropdown-item rounded-3 text-danger" type="submit">Đăng xuất</button></form></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
