<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="site-header sticky-top border-bottom bg-white">
    <nav class="navbar navbar-expand-lg py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
                <span class="brand-mark">N4</span>
                <span>nhom4tttn</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Mở menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Trang chủ</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Danh mục</a>
                        <ul class="dropdown-menu dropdown-menu-end category-menu shadow-sm border-0 rounded-4 p-2">
                            <li>
                                <a class="dropdown-item rounded-3" th:href="@{/products}">Tất cả sản phẩm</a>
                            </li>
                            <li><hr class="dropdown-divider"></li>

                            <th:block th:each="root : ${navCategories}">
                                <li class="category-menu-row">
                                    <a class="dropdown-item rounded-3 fw-semibold flex-grow-1"
                                       th:href="@{/products(categoryId=${root.id})}"
                                       th:text="${root.name}"></a>
                                    <button th:if="${isAdmin}"
                                            type="button"
                                            class="btn btn-sm btn-light rounded-circle category-edit-btn"
                                            title="Sửa danh mục"
                                            data-bs-toggle="modal"
                                            data-bs-target="#categoryModal"
                                            th:attr="data-category-id=${root.id},data-category-name=${root.name},data-parent-id=''">
                                        ✎
                                    </button>
                                </li>

                                <li class="category-menu-row" th:each="child : ${root.children}">
                                    <a class="dropdown-item rounded-3 ps-4 small flex-grow-1"
                                       th:href="@{/products(categoryId=${child.id})}"
                                       th:text="${child.name}"></a>
                                    <button th:if="${isAdmin}"
                                            type="button"
                                            class="btn btn-sm btn-light rounded-circle category-edit-btn"
                                            title="Sửa danh mục"
                                            data-bs-toggle="modal"
                                            data-bs-target="#categoryModal"
                                            th:attr="data-category-id=${child.id},data-category-name=${child.name},data-parent-id=${root.id}">
                                        ✎
                                    </button>
                                </li>
                            </th:block>

                            <th:block th:if="${isAdmin}">
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <button type="button"
                                            class="dropdown-item rounded-3 text-primary fw-semibold"
                                            data-bs-toggle="modal"
                                            data-bs-target="#categoryModal"
                                            data-category-create>
                                        + Thêm danh mục
                                    </button>
                                </li>
                            </th:block>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contact}">Liên hệ</a></li>

                    <li class="nav-item ms-lg-2" th:if="${currentUser == null}">
                        <a class="btn btn-dark rounded-pill px-4" th:href="@{/login}">Đăng nhập</a>
                    </li>
                    <li class="nav-item dropdown ms-lg-2" th:if="${currentUser != null}">
                        <a class="btn btn-outline-dark rounded-pill dropdown-toggle px-4" href="#" role="button" data-bs-toggle="dropdown" th:text="${currentUser.name}"></a>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-4 p-2">
                            <li><span class="dropdown-item-text small text-secondary" th:text="${currentUser.email}"></span></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <button class="dropdown-item rounded-3 text-danger" type="submit">Đăng xuất</button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true" th:if="${isAdmin}">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow">
                <div class="modal-header border-0 pb-0">
                    <div>
                        <span class="eyebrow">QUẢN LÝ DANH MỤC</span>
                        <h2 class="modal-title h5 fw-bold mt-2" data-category-modal-title>Thêm danh mục</h2>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body pt-4">
                    <form th:action="@{/categories/save}" method="post" data-category-form>
                        <input type="hidden" name="id" data-category-id-input>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên danh mục</label>
                            <input class="form-control" type="text" name="name" required maxlength="255" data-category-name-input>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Danh mục cha</label>
                            <select class="form-select" name="parentId" data-category-parent-input>
                                <option value="">Không có - danh mục lớn</option>
                                <option th:each="root : ${navCategories}"
                                        th:value="${root.id}"
                                        th:text="${root.name}"></option>
                            </select>
                            <div class="form-text">Project hỗ trợ 2 cấp: danh mục lớn → danh mục con.</div>
                        </div>

                        <div class="d-flex justify-content-between gap-2">
                            <button type="button"
                                    class="btn btn-outline-danger rounded-pill px-3 d-none"
                                    data-category-delete-trigger>
                                Xóa
                            </button>
                            <button class="btn btn-dark rounded-pill px-4 ms-auto" type="submit" data-category-save-label>
                                Thêm danh mục
                            </button>
                        </div>
                    </form>

                    <form th:action="@{/categories/0/delete}" method="post" class="d-none" data-category-delete-form></form>
                </div>
            </div>
        </div>
    </div>
</header>
</body>
</html>
