<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content"
     th:with="guestView=${orderMode == 'GUEST'},adminView=${orderMode == 'ADMIN'},userView=${orderMode == 'USER'}">
    <form class="commerce-card admin-order-filter-card p-3 p-md-4 mb-4"
          method="get"
          th:action="@{${orderListPath}}">
        <input type="hidden" name="sort" th:value="${sort}">
        <input type="hidden" name="direction" th:value="${direction}">

        <div class="admin-order-filter-grid">
            <div class="admin-order-filter-field" th:if="${!guestView}">
                <label class="form-label fw-semibold" for="orderKeyword">Tìm kiếm</label>
                <input class="form-control"
                       id="orderKeyword"
                       name="keyword"
                       th:value="${keyword}"
                       th:placeholder="${adminView ? 'Mã đơn, tên, email hoặc số điện thoại' : 'Mã đơn hoặc số điện thoại'}">
            </div>

            <div class="admin-order-filter-field" th:if="${guestView}">
                <label class="form-label fw-semibold" for="guestOrderCode">Mã đơn hàng</label>
                <input class="form-control"
                       id="guestOrderCode"
                       name="code"
                       th:value="${code}"
                       placeholder="GN-20260926-ABC123"
                       autocomplete="off">
            </div>

            <div class="admin-order-filter-field" th:if="${guestView}">
                <label class="form-label fw-semibold" for="guestOrderEmail">Email đặt hàng</label>
                <input class="form-control"
                       id="guestOrderEmail"
                       name="email"
                       type="email"
                       th:value="${email}"
                       placeholder="ban@email.com"
                       autocomplete="email">
            </div>

            <div class="admin-order-filter-field" th:if="${!guestView}">
                <span class="form-label fw-semibold d-block">Trạng thái</span>
                <div class="filter-combobox admin-order-status-combo" data-single-combobox>
                    <input type="hidden"
                           name="status"
                           th:value="${status != null ? status.name() : ''}"
                           data-single-combobox-input>
                    <button type="button"
                            class="filter-combobox-trigger"
                            aria-expanded="false"
                            data-single-combobox-trigger>
                        <span class="filter-combobox-value"
                              data-single-combobox-value
                              th:text="${status != null ? status.label : 'Tất cả trạng thái'}">Tất cả trạng thái</span>
                        <span class="filter-combobox-chevron" aria-hidden="true"></span>
                    </button>
                    <div class="filter-combobox-menu" data-single-combobox-menu>
                        <div class="filter-combobox-options">
                            <button type="button"
                                    class="filter-combobox-option"
                                    data-single-combobox-option
                                    data-value=""
                                    data-label="Tất cả trạng thái"
                                    th:classappend="${status == null ? ' is-selected' : ''}">
                                <span>Tất cả trạng thái</span>
                                <span class="filter-option-check">✓</span>
                            </button>
                            <button type="button"
                                    class="filter-combobox-option"
                                    th:each="item : ${statuses}"
                                    th:attr="data-value=${item.name()},data-label=${item.label}"
                                    data-single-combobox-option
                                    th:classappend="${status == item ? ' is-selected' : ''}">
                                <span th:text="${item.label}"></span>
                                <span class="filter-option-check">✓</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="admin-order-filter-action">
                <button class="btn btn-dark w-100" type="submit" th:text="${guestView ? 'Tìm đơn' : 'Lọc đơn'}">Lọc đơn</button>
            </div>
        </div>
    </form>

    <div class="alert alert-danger" th:if="${orderSearchError != null}" th:text="${orderSearchError}"></div>

    <div class="commerce-card overflow-hidden admin-order-table-card">
        <div class="table-responsive">
            <table class="table align-middle mb-0 order-table admin-order-table">
                <thead>
                <tr>
                    <th>
                        <a class="order-sort-link"
                           th:classappend="${sort == 'code' ? ' is-active' : ''}"
                           th:href="${guestView} ? @{${orderListPath}(page=0,code=${code},email=${email},sort='code',direction=${sort == 'code' and direction == 'asc' ? 'desc' : 'asc'})} : @{${orderListPath}(page=0,keyword=${keyword},status=${status != null ? status.name() : null},sort='code',direction=${sort == 'code' and direction == 'asc' ? 'desc' : 'asc'})}">
                            <span>Mã đơn</span>
                            <span class="order-sort-indicator" th:text="${sort == 'code' ? (direction == 'asc' ? '↑' : '↓') : '↕'}">↕</span>
                        </a>
                    </th>
                    <th>
                        <a class="order-sort-link"
                           th:classappend="${sort == 'customer' ? ' is-active' : ''}"
                           th:href="${guestView} ? @{${orderListPath}(page=0,code=${code},email=${email},sort='customer',direction=${sort == 'customer' and direction == 'asc' ? 'desc' : 'asc'})} : @{${orderListPath}(page=0,keyword=${keyword},status=${status != null ? status.name() : null},sort='customer',direction=${sort == 'customer' and direction == 'asc' ? 'desc' : 'asc'})}">
                            <span>Khách hàng</span>
                            <span class="order-sort-indicator" th:text="${sort == 'customer' ? (direction == 'asc' ? '↑' : '↓') : '↕'}">↕</span>
                        </a>
                    </th>
                    <th>
                        <a class="order-sort-link"
                           th:classappend="${sort == 'contact' ? ' is-active' : ''}"
                           th:href="${guestView} ? @{${orderListPath}(page=0,code=${code},email=${email},sort='contact',direction=${sort == 'contact' and direction == 'asc' ? 'desc' : 'asc'})} : @{${orderListPath}(page=0,keyword=${keyword},status=${status != null ? status.name() : null},sort='contact',direction=${sort == 'contact' and direction == 'asc' ? 'desc' : 'asc'})}">
                            <span>Liên hệ</span>
                            <span class="order-sort-indicator" th:text="${sort == 'contact' ? (direction == 'asc' ? '↑' : '↓') : '↕'}">↕</span>
                        </a>
                    </th>
                    <th>
                        <a class="order-sort-link"
                           th:classappend="${sort == 'total' ? ' is-active' : ''}"
                           th:href="${guestView} ? @{${orderListPath}(page=0,code=${code},email=${email},sort='total',direction=${sort == 'total' and direction == 'asc' ? 'desc' : 'asc'})} : @{${orderListPath}(page=0,keyword=${keyword},status=${status != null ? status.name() : null},sort='total',direction=${sort == 'total' and direction == 'asc' ? 'desc' : 'asc'})}">
                            <span>Tổng tiền</span>
                            <span class="order-sort-indicator" th:text="${sort == 'total' ? (direction == 'asc' ? '↑' : '↓') : '↕'}">↕</span>
                        </a>
                    </th>
                    <th>
                        <a class="order-sort-link"
                           th:classappend="${sort == 'status' ? ' is-active' : ''}"
                           th:href="${guestView} ? @{${orderListPath}(page=0,code=${code},email=${email},sort='status',direction=${sort == 'status' and direction == 'asc' ? 'desc' : 'asc'})} : @{${orderListPath}(page=0,keyword=${keyword},status=${status != null ? status.name() : null},sort='status',direction=${sort == 'status' and direction == 'asc' ? 'desc' : 'asc'})}">
                            <span>Trạng thái</span>
                            <span class="order-sort-indicator" th:text="${sort == 'status' ? (direction == 'asc' ? '↑' : '↓') : '↕'}">↕</span>
                        </a>
                    </th>
                    <th>
                        <a class="order-sort-link"
                           th:classappend="${sort == 'created' ? ' is-active' : ''}"
                           th:href="${guestView} ? @{${orderListPath}(page=0,code=${code},email=${email},sort='created',direction=${sort == 'created' and direction == 'asc' ? 'desc' : 'asc'})} : @{${orderListPath}(page=0,keyword=${keyword},status=${status != null ? status.name() : null},sort='created',direction=${sort == 'created' and direction == 'asc' ? 'desc' : 'asc'})}">
                            <span>Ngày đặt</span>
                            <span class="order-sort-indicator" th:text="${sort == 'created' ? (direction == 'asc' ? '↑' : '↓') : '↕'}">↓</span>
                        </a>
                    </th>
                    <th class="admin-order-action-column"><span class="visually-hidden">Thao tác</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders.content}">
                    <td><strong th:text="${order.code}"></strong></td>
                    <td>
                        <div class="fw-semibold" th:text="${order.customerName}"></div>
                        <div class="small text-secondary" th:text="${order.customerEmail}"></div>
                    </td>
                    <td th:text="${order.phone}"></td>
                    <td class="fw-semibold text-nowrap" th:text="${order.totalAmountText}"></td>
                    <td>
                        <span class="order-status-badge"
                              th:classappend="${' status-' + #strings.toLowerCase(order.status.name())}"
                              th:text="${order.status.label}"></span>
                    </td>
                    <td class="text-nowrap" th:text="${order.createdDateText}"></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-dark px-3"
                           th:if="${adminView}"
                           th:href="@{/admin/orders/{id}(id=${order.id})}"
                           th:attr="data-order-management-detail-url=@{/admin/orders/{id}/modal(id=${order.id})}">Xem</a>
                        <a class="btn btn-sm btn-outline-dark px-3"
                           th:if="${userView}"
                           th:href="@{/orders/my/{code}(code=${order.code})}"
                           th:attr="data-order-management-detail-url=@{/orders/my/{code}/modal(code=${order.code})}">Xem</a>
                        <a class="btn btn-sm btn-outline-dark px-3"
                           th:if="${guestView}"
                           th:href="@{/orders/{code}(code=${order.code},email=${email})}"
                           th:attr="data-order-management-detail-url=@{/orders/{code}/modal(code=${order.code},email=${email})}">Xem</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders.content)}">
                    <td colspan="7" class="py-5 text-center text-secondary"
                        th:text="${guestView and (code == null or #strings.isEmpty(code)) and (email == null or #strings.isEmpty(email)) ? 'Nhập mã đơn hàng và email để xem đơn hàng.' : 'Không có đơn hàng phù hợp.'}">Không có đơn hàng phù hợp.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="admin-order-table-footer">
            <div class="admin-order-result-count">
                Tổng <strong th:text="${orders.totalElements}">0</strong> hóa đơn
            </div>

            <div class="admin-order-page-controls">
                <span class="admin-order-page-count"
                      th:text="${'Trang ' + (orders.totalPages == 0 ? 1 : orders.number + 1) + ' / ' + (orders.totalPages == 0 ? 1 : orders.totalPages)}">Trang 1 / 1</span>

                <nav th:if="${orders.totalPages > 1}" aria-label="Phân trang đơn hàng">
                    <ul class="pagination mb-0">
                        <li class="page-item" th:classappend="${orders.first ? 'disabled' : ''}">
                            <a class="page-link"
                               aria-label="Trang trước"
                               th:href="${guestView} ? @{${orderListPath}(page=${orders.number - 1},code=${code},email=${email},sort=${sort},direction=${direction})} : @{${orderListPath}(page=${orders.number - 1},keyword=${keyword},status=${status != null ? status.name() : null},sort=${sort},direction=${direction})}">‹</a>
                        </li>
                        <li class="page-item"
                            th:each="index : ${#numbers.sequence(pageStart, pageEnd)}"
                            th:classappend="${index == orders.number ? 'active' : ''}">
                            <a class="page-link"
                               th:href="${guestView} ? @{${orderListPath}(page=${index},code=${code},email=${email},sort=${sort},direction=${direction})} : @{${orderListPath}(page=${index},keyword=${keyword},status=${status != null ? status.name() : null},sort=${sort},direction=${direction})}"
                               th:text="${index + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${orders.last ? 'disabled' : ''}">
                            <a class="page-link"
                               aria-label="Trang sau"
                               th:href="${guestView} ? @{${orderListPath}(page=${orders.number + 1},code=${code},email=${email},sort=${sort},direction=${direction})} : @{${orderListPath}(page=${orders.number + 1},keyword=${keyword},status=${status != null ? status.name() : null},sort=${sort},direction=${direction})}">›</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
</body>
</html>
