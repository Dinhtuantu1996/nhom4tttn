<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="product-detail-modal-content">
    <div class="modal-header border-0 pb-0">
        <div class="min-w-0">
            <span class="eyebrow">CHI TIẾT SẢN PHẨM</span>
            <h2 class="modal-title h5 fw-bold mt-2 text-truncate" th:text="${product.name}"></h2>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
    </div>

    <div class="modal-body pt-3">
        <div class="row g-4 g-lg-5">
            <div class="col-lg-7">
                <div id="productDetailGallery"
                     class="carousel slide product-detail-gallery"
                     th:if="${!#lists.isEmpty(product.images)}">
                    <div class="carousel-inner rounded-4 overflow-hidden bg-light border">
                        <div class="carousel-item"
                             th:each="image, state : ${product.images}"
                             th:classappend="${state.first} ? 'active'">
                            <img class="d-block w-100"
                                 th:src="${image.url}"
                                 th:alt="${product.name}">
                        </div>
                    </div>
                    <button class="carousel-control-prev"
                            type="button"
                            data-bs-target="#productDetailGallery"
                            data-bs-slide="prev"
                            th:if="${product.images.size() > 1}">
                        <span class="carousel-control-prev-icon"></span>
                        <span class="visually-hidden">Ảnh trước</span>
                    </button>
                    <button class="carousel-control-next"
                            type="button"
                            data-bs-target="#productDetailGallery"
                            data-bs-slide="next"
                            th:if="${product.images.size() > 1}">
                        <span class="carousel-control-next-icon"></span>
                        <span class="visually-hidden">Ảnh sau</span>
                    </button>
                </div>
                <div class="product-detail-empty rounded-4"
                     th:if="${#lists.isEmpty(product.images)}">N4</div>
            </div>

            <div class="col-lg-5" data-product-detail-scope
                 th:attr="data-product-id=${product.id},data-product-variant-type=${product.variantType},data-product-quantity=${product.quantity}">
                <div class="d-flex flex-wrap gap-2 mb-3" th:if="${!#sets.isEmpty(product.categories)}">
                    <a class="badge rounded-pill text-bg-light border text-decoration-none text-dark"
                       th:each="category : ${product.categories}"
                       th:href="@{/products(categoryId=${category.id})}"
                       th:text="${category.name}"></a>
                </div>

                <h3 class="h2 fw-bold mb-0" th:text="${product.name}"></h3>

                <div class="d-flex flex-wrap gap-3 text-secondary small mt-3">
                    <span th:text="${product.viewCount + ' lượt xem'}"></span>
                    <span th:text="${'Cập nhật ' + product.updatedDateText}"></span>
                </div>

                <div class="product-detail-commercial mt-4"
                     data-product-commercial
                     th:classappend="${product.variantType > 0 ? ' variant-price-pending' : ''}"
                     th:attr="data-default-price-text=${product.displayPriceAvailable ? product.displayPriceText : 'Liên hệ'},data-default-available=${product.displayPriceAvailable},data-variant-type=${product.variantType}">
                    <div data-product-price
                         th:class="${product.displayPriceAvailable ? 'product-detail-price' : 'product-detail-contact-price'}"
                         th:text="${product.displayPriceAvailable ? product.displayPriceText : 'Liên hệ'}"></div>
                    <div class="product-detail-stock" data-product-stock
                         th:text="${product.variantType == 0
                             ? (product.quantity > 0 ? 'Còn ' + product.quantity + ' sản phẩm' : 'Liên hệ N4 để biết thêm thông tin.')
                             : (product.displayPriceAvailable ? 'Chọn biến thể để xem giá và số lượng.' : 'Hiện chưa có biến thể còn hàng.')}"></div>
                </div>

                <div th:replace="~{fragments/product-variant-display :: selector}"></div>

                <div class="d-flex gap-2 flex-wrap mt-3" th:if="${!#sets.isEmpty(product.attributes)}">
                    <span class="badge rounded-pill text-bg-light border text-dark p-2"
                          th:each="attribute : ${product.attributes}"
                          th:text="${attribute.parent.name + ': ' + attribute.name}"></span>
                </div>

                <hr class="my-4">
                <div class="product-description" th:text="${product.description}"></div>

                <div class="d-grid gap-2 mt-4">
                    <button type="button"
                            class="btn btn-teal btn-lg rounded-pill"
                            data-add-to-cart
                            th:disabled="${product.variantType == 0 ? product.quantity <= 0 : true}">
                        Thêm vào giỏ hàng
                    </button>
                    <a th:href="@{/contact}" class="btn btn-outline-dark rounded-pill">Liên hệ hỏi mua</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
