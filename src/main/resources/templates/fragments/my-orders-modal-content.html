<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="modal-header border-0 pb-0">
        <div>
            <span class="eyebrow">ĐƠN HÀNG CỦA TÔI</span>
            <h2 class="modal-title h4 fw-bold mt-2 mb-1">Lịch sử mua hàng</h2>
            <p class="text-secondary mb-0 small" th:text="${'Các đơn đặt bằng email ' + accountEmail}"></p>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
    </div>

    <div class="modal-body pt-4 customer-order-scroll">
        <div class="commerce-card overflow-hidden" th:if="${!#lists.isEmpty(orders)}">
            <div class="table-responsive">
                <table class="table align-middle mb-0 order-table">
                    <thead>
                    <tr>
                        <th>Mã đơn</th>
                        <th>Ngày đặt</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td><strong th:text="${order.code}"></strong></td>
                        <td class="text-nowrap" th:text="${order.createdDateText}"></td>
                        <td class="fw-semibold text-nowrap" th:text="${order.totalAmountText}"></td>
                        <td>
                            <span class="order-status-badge"
                                  th:classappend="${' status-' + #strings.toLowerCase(order.status.name())}"
                                  th:text="${order.status.label}"></span>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-dark rounded-pill px-3"
                               data-order-remote-link
                               th:href="@{/orders/modal/my/{code}(code=${order.code})}">Chi tiết</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="commerce-card p-4 p-md-5 text-center" th:if="${#lists.isEmpty(orders)}">
            <h3 class="h5 fw-bold">Chưa có đơn hàng nào</h3>
            <p class="text-secondary mb-0">Đơn đặt bằng cùng email tài khoản sẽ xuất hiện tại đây.</p>
        </div>
    </div>
</div>
</body>
</html>
