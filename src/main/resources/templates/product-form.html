<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${form.id == null ? 'Thêm sản phẩm - N4' : 'Sửa sản phẩm - N4'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/n4-logo.svg}">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
    <div class="mb-4">
        <a th:href="@{/products}" class="text-decoration-none text-secondary">← Quay lại sản phẩm</a>
    </div>
    <div class="admin-card p-3 p-lg-4">
        <div th:replace="~{fragments/product-form-content :: content}"></div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
