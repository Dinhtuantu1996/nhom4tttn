<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${review.order.code + ' - Góc Nhà'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/goc-nha-logo.svg}">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
    <div class="mb-4">
        <a class="text-decoration-none text-secondary"
           th:if="${adminMode}"
           th:href="@{/admin/orders}">← Quản lý đơn hàng</a>
        <a class="text-decoration-none text-secondary"
           th:if="${!adminMode and (guestMode == null or !guestMode)}"
           th:href="@{/orders/my}">← Quản lý đơn hàng</a>
        <a class="text-decoration-none text-secondary"
           th:if="${!adminMode and guestMode}"
           th:href="@{/orders(code=${review.order.code},email=${guestEmail})}">← Quản lý đơn hàng</a>
    </div>

    <div class="commerce-page-head mb-4">
        <h1 class="display-6 fw-bold mb-0">Chi tiết đơn</h1>
    </div>

    <div th:replace="~{fragments/order-management-detail-body :: content(adminMode=${adminMode}, adminModal=false)}"></div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
