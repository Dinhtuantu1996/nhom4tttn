<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="${review.order.code + ' - Góc Nhà'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" th:href="@{/img/goc-nha-logo.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
    <div class="mb-4">
        <a class="text-decoration-none text-secondary"
           th:href="@{/admin/orders}"
           th:if="${adminMode}">← Quản lý đơn hàng</a>
        <a class="text-decoration-none text-secondary"
           th:href="@{/orders/my}"
           th:if="${!adminMode and (guestMode == null or !guestMode)}">← Quản lý đơn hàng</a>
        <a class="text-decoration-none text-secondary"
           th:href="@{/orders(code=${review.order.code},email=${guestEmail})}"
           th:if="${!adminMode and guestMode}">← Quản lý đơn hàng</a>
    </div>

    <div class="commerce-page-head mb-4">
        <h1 class="display-6 fw-bold mb-0">Chi tiết đơn</h1>
    </div>

    <div th:replace="~{fragments/order-management-detail-body :: content(adminMode=${adminMode}, adminModal=false)}"></div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
