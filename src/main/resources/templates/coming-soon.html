<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Đang xây dựng - Góc Nhà</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" th:href="@{/img/goc-nha-logo.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-body">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="auth-card coming-soon-card p-5 text-center shadow-lg">
        <img alt="Góc Nhà logo" class="brand-logo brand-logo-lg mx-auto mb-4" src="/img/goc-nha-logo.svg"
             th:src="@{/img/goc-nha-logo.svg}">
        <span class="eyebrow">SẮP RA MẮT</span>
        <h1 class="h2 fw-bold mt-3">Trang này đang được hoàn thiện</h1>
        <p class="text-secondary mt-3">Góc Nhà đang hoàn thiện nội dung này. Vui lòng quay lại sau.</p>
        <div class="d-flex gap-2 justify-content-center mt-4">
            <a class="btn btn-dark rounded-pill px-4" th:href="@{/login}">Đăng nhập</a>
            <a class="btn btn-outline-dark rounded-pill px-4" th:href="@{/}">Trang chủ</a>
        </div>
    </div>
</main>
</body>
</html>
