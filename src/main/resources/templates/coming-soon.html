<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đang xây dựng - Góc Nhà</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/goc-nha-logo.svg}">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="auth-body">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="auth-card coming-soon-card p-5 text-center shadow-lg">
        <img class="brand-logo brand-logo-lg mx-auto mb-4" th:src="@{/img/goc-nha-logo.svg}" src="/img/goc-nha-logo.svg" alt="Góc Nhà logo">
        <span class="eyebrow">SẮP RA MẮT</span>
        <h1 class="h2 fw-bold mt-3">Trang này đang được hoàn thiện</h1>
        <p class="text-secondary mt-3">Góc Nhà đang hoàn thiện nội dung này. Vui lòng quay lại sau.</p>
        <div class="d-flex gap-2 justify-content-center mt-4">
            <a th:href="@{/login}" class="btn btn-dark rounded-pill px-4">Đăng nhập</a>
            <a th:href="@{/}" class="btn btn-outline-dark rounded-pill px-4">Trang chủ</a>
        </div>
    </div>
</main>
</body>
</html>
