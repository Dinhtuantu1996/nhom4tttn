spring.application.name=nhom4tttn
server.port=8080

spring.datasource.url=jdbc:mysql://${ip-sql}/nhom4tttn?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Ho_Chi_Minh&forceConnectionTimeZoneToSession=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${user-name-sql}
spring.datasource.password=${password-sql}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.pool-name=Nhom4TttnHikariPool

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
spring.web.error.include-message=always
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=NHOM4_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.upload-dir=${user.dir}/uploads
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
server.tomcat.max-part-count=300

app.admin.name=Administrator
app.admin.email=admin@nhom4tttn.local
app.admin.password=Admin@123

app.google.client-id=283518259371-a38oshjd164ffjk44ningsfaf4epl2nd.apps.googleusercontent.com
