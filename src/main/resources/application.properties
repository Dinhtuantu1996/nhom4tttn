spring.application.name=gocnha-store
server.port=8080
spring.datasource.url=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.pool-name=GocNhaHikariPool
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
spring.web.error.include-message=always
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=GOCNHA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.r2.endpoint=
app.r2.bucket=
app.r2.access-key=
app.r2.secret-key=
app.r2.public-url=
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
server.tomcat.max-part-count=300
app.admin.name=ADMIN
app.admin.email=admin@gocnha.local
app.admin.password=Admin@123
app.google.client-id=
